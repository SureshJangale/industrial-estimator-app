services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in local .env}
      POSTGRES_DB: estimator
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 4s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in local .env}
      DATABASE_URL: postgresql+psycopg://estimator:${DB_PASSWORD}@db:5432/estimator
      PRIVATE_DIR: /app/runtime/files
    ports:
      - '127.0.0.1:8000:8000'
    volumes:
      - private_files:/app/runtime/files
volumes:
  postgres_data:
  private_files:
